# ============================================================
#  应用配置
#
#  ⚠️ 这个文件会进 git，所以里面**不允许出现任何真实密钥**。
#     所有敏感值都用 ${环境变量名} 引用，真实值放在：
#       本地开发 → 项目根目录 .env（已被 .gitignore 排除，用 run-local.ps1 加载）
#       云服务器 → /etc/music/env（权限 600，由 systemd 注入）
#     要新增配置项时，请同步更新 .env.example
# ============================================================

spring:
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

  datasource:
    # 冒号后面是「找不到环境变量时用的默认值」，只给不敏感的项配默认值
    url: ${DB_URL:jdbc:mysql://localhost:3306/music_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    # 注意：这里没有默认值 → 没配 DB_PASSWORD 就启动失败，防止用弱口令上线
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      timeout: 3000ms

  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          ssl:
            enable: true
          auth: true
          starttls:
            enable: false

server:
  port: 8080

# ============================================================
#  文件存储
#
#  本项目已改为「纯本地磁盘存储」，对象存储（S3）不再使用。
#  HybridStorageService 检测到 s3.endpoint / access-key 为空时，
#  会自动把所有上传类型（音频、封面、歌词）都走本地，见该类第 34-44 行。
#
#  如果将来要重新启用对象存储，在 .env 里补上这 5 个变量即可，
#  代码会自动切回混合存储，无需改 Java：
#     S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET_NAME / S3_URL_PREFIX
# ============================================================
app:
  # 上传目录。相对路径以「启动时的工作目录」为基准，
  # 服务器上建议改成绝对路径（如 /opt/music/uploads），避免换目录后文件"丢失"
  upload-dir: ${UPLOAD_DIR:./uploads}
  upload-url-prefix: /uploads

  # ============================================================
  #  本地音乐库扫描（可选）
  #
  #  配了 audio-dir 之后：
  #    · 管理后台「音乐库扫描」可把该目录下的音乐直接扫进数据库
  #    · 目录同时挂载到 /library/** 供浏览器播放，文件不复制、不占额外空间
  #    · lyric-dir 只用于读取歌词文本存进数据库，不对外暴露
  #  留空则这两项能力关闭，其他功能不受影响。
  # ============================================================
  library:
    audio-dir: ${LIBRARY_AUDIO_DIR:}
    lyric-dir: ${LIBRARY_LYRIC_DIR:}

jwt:
  # 没有默认值 → 没配就启动失败
  # 更换这个值会让所有已签发的 Token 立即失效（全员需要重新登录），这是预期行为
  secret: ${JWT_SECRET}
  expiration: 86400000
